name: Release
on:
  # DRY RUN of the artifact-action upgrades: runs on pushes to this test branch only, never on tags.
  push:
    branches: [ci/dependabot-artifact-dryrun]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: titan }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: titan }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: titan.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo test --release --locked
      - run: cargo build --release --locked --bin titan --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="titan-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: "*.tar.gz"
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { merge-multiple: true }
      - name: Verify artifacts (dry run; no release is created)
        run: |
          ls -la
          n=$(ls *.tar.gz | wc -l)
          echo "tarballs: $n"
          test "$n" -ge 1
          sha256sum *.tar.gz
          for f in *.tar.gz; do tar -tzf "$f" > /dev/null; done
