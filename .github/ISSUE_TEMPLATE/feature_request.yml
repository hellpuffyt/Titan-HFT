name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to learn, measure, or build?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would it work? Which modules would change?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
